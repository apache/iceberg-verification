# The format of this file is documented at
# https://github.com/apache/infrastructure-asfyaml/blob/main/README.md
#
# This file only takes effect on the default branch.

github:
  description: "Conformance fixtures for verifying Apache Iceberg implementations"
  homepage: https://iceberg.apache.org/
  labels:
    - iceberg
    - apache
    - conformance
    - verification

  enabled_merge_buttons:
    merge: false
    squash: true
    squash_commit_message: PR_TITLE_AND_COMMIT_DETAILS
    rebase: false

  pull_requests:
    # auto-delete head branches after being merged
    del_branch_on_merge: true

  protected_branches:
    main:
      required_pull_request_reviews:
        required_approving_review_count: 1
      required_linear_history: true

  features:
    # Divergence bugs belong in the implementation repository that diverges.
    # Fixture design is discussed on dev@iceberg.apache.org.
    issues: false
    wiki: false
    projects: false

  collaborators: # Note: the number of collaborators is limited to 10
    - nssalian

notifications:
  commits:      commits@iceberg.apache.org
  issues:       issues@iceberg.apache.org
  pullrequests: issues@iceberg.apache.org
