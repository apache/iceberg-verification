plugins {
  id 'application'
  id 'com.diffplug.spotless' version '8.9.0'
}

// Release lane pins a published iceberg-api. The nightly lane passes
// -PicebergVersion=<x>-SNAPSHOT to test dev HEAD via the ASF snapshot.
def icebergVersion = (project.findProperty('icebergVersion') ?: '1.11.0').toString()

repositories {
  mavenCentral()
  // Only consulted for SNAPSHOTs (the nightly lane); releases resolve from Central.
  if (icebergVersion.endsWith('SNAPSHOT')) {
    maven { url = uri('https://repository.apache.org/content/repositories/snapshots') }
  }
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(17)
  }
}

dependencies {
  // The implementation under test. iceberg-api carries the primitive/geo type
  // parser (org.apache.iceberg.types.Types.fromTypeName); iceberg-core carries
  // the nested-type JSON reader (org.apache.iceberg.SchemaParser.fromJson).
  // dev/run-local.sh overrides these with --include-build onto a clone of apache/main.
  implementation "org.apache.iceberg:iceberg-api:${icebergVersion}"
  implementation "org.apache.iceberg:iceberg-core:${icebergVersion}"
  // Only used to read the cases.json fixtures.
  implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
}

application {
  mainClass = 'org.apache.iceberg.conformance.VerifyTypes'
}

// Google Java Format, matching Apache Iceberg. Run `./gradlew spotlessApply`.
spotless {
  java {
    googleJavaFormat("1.22.0")
    removeUnusedImports()
    trimTrailingWhitespace()
    endWithNewline()
  }
}

// `./gradlew run` walks up to the repo root (the directory containing
// table-spec/) on its own, so no args are needed.
