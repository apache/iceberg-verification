name: "Validate Fixtures"

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate fixture cases
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # ubuntu-24.04 ships python3; no extra setup action is needed for a
    # dependency-free stdlib validator.
    - name: Validate cases.json
      run: python3 dev/validate-fixtures.py
    - name: Check runner deps are release-clean
      run: bash dev/check-runner-deps.sh
