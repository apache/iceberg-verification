# Conformance: the Rust runner against apache/iceberg-rust main HEAD (latest
# commit). One implementation per workflow. Go/Rust/Python track main; Java
# tracks the nightly SNAPSHOT.
name: "Conformance (Rust)"

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  conformance-rust:
    name: iceberg-rust type conformance
    runs-on: ubuntu-24.04
    # Non-blocking: report a divergence, do not fail this repo's CI.
    continue-on-error: true
    steps:
    - name: Checkout fixtures
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup Rust toolchain
      working-directory: runners/rust
      # rust-toolchain.toml (channel = stable) is the source of truth.
      run: rustup show && rustup update stable
    - name: Cache Rust artifacts
      uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      with:
        workspaces: runners/rust
    - name: Run type conformance
      id: run
      working-directory: runners/rust
      # Build against iceberg-rust main HEAD; the Cargo.toml edit is ephemeral, not committed.
      run: |
        set +e
        cargo add iceberg --git https://github.com/apache/iceberg-rust --branch main --no-default-features || { echo "code=2" >> "$GITHUB_OUTPUT"; exit 2; }
        cargo build --quiet || { echo "code=2" >> "$GITHUB_OUTPUT"; exit 2; }
        echo "resolved=iceberg-rust@main" >> "$GITHUB_OUTPUT"
        cargo run --quiet 2>&1 | tee "$GITHUB_WORKSPACE/runner-output.txt"
        code=${PIPESTATUS[0]}
        echo "code=$code" >> "$GITHUB_OUTPUT"
        # Report-only: only a runner ERROR (2) reddens the check, not a divergence.
        if [ "$code" = "2" ]; then exit 1; fi
    - name: Report results (step summary + annotations)
      if: always()
      run: >
        bash "$GITHUB_WORKSPACE/dev/ci-report.sh"
        iceberg-rust "$GITHUB_WORKSPACE/runner-output.txt"
        main "${{ steps.run.outputs.code }}"
        "${{ steps.run.outputs.resolved }}"
