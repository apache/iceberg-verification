# Conformance: the Go runner against apache/iceberg-go main HEAD (latest commit).
# One implementation per workflow. Go/Rust/Python track main; Java tracks the
# nightly SNAPSHOT.
name: "Conformance (Go)"

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  conformance-go:
    name: iceberg-go type conformance
    runs-on: ubuntu-24.04
    # Non-blocking: report a divergence, do not fail this repo's CI.
    continue-on-error: true
    steps:
    - name: Checkout fixtures
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.25.9'
        cache-dependency-path: runners/go/go.sum
    - name: Run type conformance
      id: run
      working-directory: runners/go
      # Build against iceberg-go main HEAD; the go.mod edit is ephemeral, not committed.
      run: |
        set +e
        go get github.com/apache/iceberg-go@main || { echo "code=2" >> "$GITHUB_OUTPUT"; exit 2; }
        go mod tidy || { echo "code=2" >> "$GITHUB_OUTPUT"; exit 2; }
        resolved="iceberg-go@$(go list -m github.com/apache/iceberg-go | awk '{print $2}')"
        echo "resolved=$resolved" >> "$GITHUB_OUTPUT"
        go build -o /tmp/conformance-go . || { echo "code=2" >> "$GITHUB_OUTPUT"; exit 2; }
        /tmp/conformance-go 2>&1 | tee "$GITHUB_WORKSPACE/runner-output.txt"
        code=${PIPESTATUS[0]}
        echo "code=$code" >> "$GITHUB_OUTPUT"
        # Report-only: only a runner ERROR (2) reddens the check, not a divergence.
        if [ "$code" = "2" ]; then exit 1; fi
    - name: Report results (step summary + annotations)
      if: always()
      run: >
        bash "$GITHUB_WORKSPACE/dev/ci-report.sh"
        iceberg-go "$GITHUB_WORKSPACE/runner-output.txt"
        main "${{ steps.run.outputs.code }}"
        "${{ steps.run.outputs.resolved }}"
