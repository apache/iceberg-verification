# Conformance: the Python runner against apache/iceberg-python main HEAD (latest
# commit). One implementation per workflow. Go/Rust/Python track main; Java
# tracks the nightly SNAPSHOT.
name: "Conformance (Python)"

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  conformance-python:
    name: pyiceberg type conformance
    runs-on: ubuntu-24.04
    # Non-blocking: report a divergence, do not fail this repo's CI.
    continue-on-error: true
    steps:
    - name: Checkout fixtures
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.12'
    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        enable-cache: true
    - name: Install pyiceberg (main HEAD)
      id: install
      run: |
        uv pip install --system "pyiceberg @ git+https://github.com/apache/iceberg-python.git@main"
        echo "resolved=pyiceberg@main" >> "$GITHUB_OUTPUT"
    - name: Run type conformance
      id: run
      working-directory: runners/python
      run: |
        set +e
        python runner.py 2>&1 | tee "$GITHUB_WORKSPACE/runner-output.txt"
        code=${PIPESTATUS[0]}
        echo "code=$code" >> "$GITHUB_OUTPUT"
        # Report-only: only a runner ERROR (2) reddens the check, not a divergence.
        if [ "$code" = "2" ]; then exit 1; fi
    - name: Report results (step summary + annotations)
      if: always()
      run: >
        bash "$GITHUB_WORKSPACE/dev/ci-report.sh"
        pyiceberg "$GITHUB_WORKSPACE/runner-output.txt"
        main "${{ steps.run.outputs.code }}"
        "${{ steps.install.outputs.resolved }}"
