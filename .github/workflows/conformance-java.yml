# Conformance: the Java runner against the latest iceberg-api SNAPSHOT (resolved at
# run time). Go/Rust/Python track main; Java tracks the SNAPSHOT.
name: "Conformance (Java)"

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  conformance-java:
    name: iceberg-java type conformance
    runs-on: ubuntu-24.04
    # Non-blocking: report a divergence, do not fail this repo's CI.
    continue-on-error: true
    steps:
    - name: Checkout fixtures
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Java
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: zulu
        java-version: '17'
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
    - name: Run type conformance
      id: run
      working-directory: runners/java
      # Resolve the latest iceberg-api SNAPSHOT at run time (pinned fallback), then
      # run the launcher directly so the runner's own exit code survives.
      run: |
        set +e
        meta="https://repository.apache.org/content/repositories/snapshots/org/apache/iceberg/iceberg-api/maven-metadata.xml"
        version="$(curl -fsSL "$meta" | grep -o '<latest>[^<]*</latest>' | sed -e 's/<[^>]*>//g' | head -1)"
        if [ -z "$version" ]; then
          version="1.12.0-SNAPSHOT"
          echo "WARN: could not resolve latest SNAPSHOT from $meta; using fallback $version" >&2
        fi
        echo "resolved=iceberg-api:$version" >> "$GITHUB_OUTPUT"
        ./gradlew installDist --quiet -PicebergVersion="$version" || { echo "code=2" >> "$GITHUB_OUTPUT"; exit 2; }
        build/install/conformance-java/bin/conformance-java 2>&1 | tee "$GITHUB_WORKSPACE/runner-output.txt"
        code=${PIPESTATUS[0]}
        echo "code=$code" >> "$GITHUB_OUTPUT"
        # Report-only: only a runner ERROR (2) reddens the check, not a divergence.
        if [ "$code" = "2" ]; then exit 1; fi
    - name: Report results (step summary + annotations)
      if: always()
      run: >
        bash "$GITHUB_WORKSPACE/dev/ci-report.sh"
        iceberg-java "$GITHUB_WORKSPACE/runner-output.txt"
        snapshot "${{ steps.run.outputs.code }}"
        "${{ steps.run.outputs.resolved }}"
