name: "Conformance (Java)"

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 15
      fail-fast: false
      matrix:
        os:
          - 'ubuntu-latest'
          - 'macos-latest'
    steps:
    - name: Checkout fixtures
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Check runner deps are release-clean
      run: bash dev/check-runner-deps.sh
    - name: Install Java
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: zulu
        java-version: '17'
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
    - name: Format check and grader self-test
      working-directory: runners/java
      run: ./gradlew spotlessCheck test

  conformance-java:
    name: iceberg-java type conformance ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - 'ubuntu-latest'
          - 'macos-latest'
    # Advisory: never blocks this repo's CI (tracks a moving upstream SNAPSHOT).
    continue-on-error: true
    steps:
    - name: Checkout fixtures
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Java
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: zulu
        java-version: '17'
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
    - name: Run type conformance
      id: run
      working-directory: runners/java
      run: |
        set +e
        meta="https://repository.apache.org/content/repositories/snapshots/org/apache/iceberg/iceberg-api/maven-metadata.xml"
        version="$(curl -fsSL "$meta" | grep -o '<latest>[^<]*</latest>' | sed -e 's/<[^>]*>//g' | head -1)"
        if [ -z "$version" ]; then
          version="1.12.0-SNAPSHOT"
          echo "WARN: could not resolve latest SNAPSHOT from $meta; using fallback $version" >&2
        fi
        echo "resolved=iceberg-api:$version" >> "$GITHUB_OUTPUT"
        if ./gradlew installDist --quiet -PicebergVersion="$version"; then
          build/install/conformance-java/bin/conformance-java --surface types 2>&1 | tee "$GITHUB_WORKSPACE/runner-output.txt"
          code=${PIPESTATUS[0]}
        else
          code=2
        fi
        echo "code=$code" >> "$GITHUB_OUTPUT"
    - name: Report results (step summary + annotations)
      if: always()
      env:
        RUN_CODE: ${{ steps.run.outputs.code }}
        RUN_RESOLVED: ${{ steps.run.outputs.resolved }}
      run: >
        bash "$GITHUB_WORKSPACE/dev/ci-report.sh"
        iceberg-java "$GITHUB_WORKSPACE/runner-output.txt"
        snapshot "$RUN_CODE"
        "$RUN_RESOLVED"
