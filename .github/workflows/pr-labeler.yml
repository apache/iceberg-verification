# Applies the label for each title prefix listed in the "Pull request titles"
# section of CONTRIBUTING.md, and removes prefix labels the title no longer has.
# pull_request_target is needed so that pull requests from forks can be
# labeled. It is safe here because the job never checks out the pull request
# and reads the title only through the environment.
name: "Pull Request Labeler"

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, edited, reopened]

permissions:
  pull-requests: write

jobs:
  label:
    name: Label from title prefix
    runs-on: ubuntu-24.04
    steps:
    - name: Sync labels with the title prefix
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        TITLE: ${{ github.event.pull_request.title }}
      run: |
        declare -A label_for=(
          [Fixture]=fixtures [Tooling]=tooling [CI]=ci
          [Docs]=docs [Policy]=policy [Infra]=infra
        )
        prefixes='Fixture|Tooling|CI|Docs|Policy|Infra'
        pattern="^((${prefixes})(, (${prefixes}))*): "
        if [[ ! "$TITLE" =~ $pattern ]]; then
          echo "Title has no valid prefix, leaving labels unchanged."
          exit 0
        fi

        declare -A wanted=()
        IFS=',' read -ra kinds <<< "${BASH_REMATCH[1]}"
        for kind in "${kinds[@]}"; do
          wanted[${label_for[${kind# }]}]=1
        done

        current=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/labels" --jq '.[].name')
        for label in "${label_for[@]}"; do
          if grep -qxF "$label" <<< "$current"; then
            if [[ -z "${wanted[$label]:-}" ]]; then
              echo "Removing label: ${label}"
              gh api -X DELETE "repos/${REPO}/issues/${PR_NUMBER}/labels/${label}" > /dev/null
            fi
          elif [[ -n "${wanted[$label]:-}" ]]; then
            echo "Adding label: ${label}"
            gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/labels" -f "labels[]=${label}" > /dev/null
          fi
        done
