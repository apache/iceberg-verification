name: Fixture
description: A new test surface, new cases in an existing surface, or a correction to a committed fixture.
labels: ["fixtures"]
body:
  - type: markdown
    attributes:
      value: |
        Fixtures record a settled interpretation of the spec as values.
        If a spec behavior is unclear and warrants a discussion, the discussion should be had on
        `dev@iceberg.apache.org`.

  - type: dropdown
    id: fixture_change
    attributes:
      label: Change
      description: |
        - **New test surface**: a spec behavior no surface covers today.
        - **New cases in an existing surface**: further inputs and expected values under a surface that already exists.
        - **Fixture correction**: report a committed input, expected value, or reference table that is incorrect.
      options:
        - New test surface
        - New cases in an existing surface
        - Fixture correction
    validations:
      required: true

  - type: input
    id: spec_reference
    attributes:
      label: Spec reference
      description: Link to the section of the table spec the behavior comes from.
      placeholder: https://github.com/apache/iceberg/blob/main/format/spec.md#appendix-c-json-serialization
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Description
      description: >-
        The change, fix, or new test being proposed. For a new test surface,
        state the assertion it will verify.
    validations:
      required: true
